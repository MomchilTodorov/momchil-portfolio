<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0b0b">
  <style>
    html { background-color: #0b0b0b; }
    html[data-gallery-boot="pending"] .showcase:has(.project-gallery[data-starting]) {
      visibility: hidden;
    }
  </style>
  <script>
    if (location.pathname === '/' && matchMedia('(prefers-reduced-motion: no-preference)').matches) {
      const root = document.documentElement;
      root.dataset.galleryBoot = 'pending';
      // Reveal the static homepage if the application bundle fails or takes too long.
      setTimeout(() => {
        if (root.dataset.galleryBoot === 'pending') root.dataset.galleryBoot = 'expired';
      }, 5000);
    }
  </script>
  <meta name="description" content="Momchil Todorov — senior WordPress and WooCommerce developer in Varna, Bulgaria.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Momchil Todorov — WordPress & WooCommerce Developer">
  <meta property="og:description" content="Selected agency work in WordPress, WooCommerce and business integrations.">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
  <title>Momchil Todorov — WordPress & WooCommerce Developer</title>
</head>
<body>
  <div id="root"><!--app-html--></div>
  <!--portfolio-data-->
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
